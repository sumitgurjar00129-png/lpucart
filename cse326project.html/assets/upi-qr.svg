    <rect x="150" y="105" width="18" height="12"/>
    
    <rect x="108" y="125" width="18" height="12"/>
    <rect x="138" y="125" width="12" height="24"/>
    <rect x="160" y="125" width="12" height="12"/>

    <rect x="108" y="155" width="12" height="12"/>
    <rect x="126" y="155" width="24" height="12"/>
    <rect x="156" y="155" width="18" height="12"/>
    <rect x="184" y="155" width="12" height="18"/>
    <rect x="204" y="155" width="24" height="12"/>

    <rect x="50" y="160" width="18" height="12"/>
    <rect x="76" y="160" width="20" height="12"/>

    <rect x="50" y="185" width="12" height="20"/>
    <rect x="70" y="185" width="26" height="12"/>
    <rect x="108" y="180" width="12" height="24"/>
    <rect x="130" y="180" width="20" height="20"/>
    <rect x="160" y="180" width="24" height="12"/>
